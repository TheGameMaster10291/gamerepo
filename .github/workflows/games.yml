name: Build games.json

# Rebuilds the library index every time anything is pushed, so adding a game
# stays "drop the .html in and push". The library itself only ever reads
# raw.githubusercontent.com.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild the index
        run: python3 .github/scripts/build_games.py

      - name: Commit it if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.json
          git diff --quiet --cached || git commit -m "update games.json"
          git push
